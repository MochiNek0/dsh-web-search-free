# dsh bundle patch for dsh-web-search-free.
#
# Applied as a profile layer in dsh.profile.bundles order; later layers
# override earlier ones by entry id, so the `web` row repoint below wins
# over dsh-base's `searchProvider: deepseek-official`. Installing this plugin
# into a profile's bundles routes web search/fetch through it; removing the
# plugin drops this layer and the base route returns — no manual profile
# patch needed.
#
# The web seam (`@deepseek-ai/dsh-web`, row id `web`) selects a provider by id
# at execution time; `web-search-free` is the id this plugin's host half
# registers, and its own `providerOrder` setting governs the per-backend
# fallback sequence inside the provider.
- insert:
    - id: web-search-free
      name: 'dsh-web-search-free'

# Repoint the web capability seam at this plugin's provider. dsh-base pins
# `searchProvider: deepseek-official`; a non-insert patch with a matching id
# overrides that entry's config wholesale, so both capabilities resolve here.
- id: web
  config:
    searchProvider: web-search-free
    fetchProvider: web-search-free

# `tool-web` is deliberately NOT patched here.
#
# Since dsh 0.1.5 the model-facing web tools are mounted by the composition
# itself: dsh-base's `tool-web` row ships `fetch: true` (TUI/headless), and
# every shipped agent preset mounts its own scoped `tool-web` row (the Web
# surface disables the host row and composes per session). Preset files are
# loaded by dsh-agent-presets from its own roots and are NOT part of the
# profile patch stack, so a bundle patch cannot reach them — and none needs
# to: every one of those rows serves its tools through the seam patched
# above, so this plugin's providers back `web_search` and `web_fetch` on
# every surface already. Mounting tool-web here as well would only
# duplicate-register `web_fetch` (a per-agent scope shadows a global, so the
# preset's row would win and a self-mounted copy could never be toggled).
#
# That is also why `enableFetch` is a PROVIDER availability gate rather than
# a tool switch: with it off, the tool stays registered and each call fails
# with the seam's structured WEB_PROVIDER_CONFIGURED_UNAVAILABLE error. See
# `apply` in src/index.ts.
