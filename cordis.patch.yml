# dsh bundle patch for dsh-web-search-free.
#
# Applied as a profile layer in dsh.profile.bundles order; later layers
# override earlier ones by entry id, so the `web` row repoint below wins
# over dsh-base's `searchProvider: deepseek-official`. Installing this plugin
# into a profile's bundles routes web search/fetch through it; removing the
# plugin drops this layer and the base route returns — no manual profile
# patch needed.
#
# The web seam selects by provider id; `web-search-free` is the id this
# plugin's host half registers, and its own `providerOrder` setting governs
# the per-backend fallback sequence inside the provider.
- insert:
    - id: web-search-free
      name: 'dsh-web-search-free'

# Repoint the web capability seam at this plugin's provider. dsh-base pins
# `searchProvider: deepseek-official`; a non-insert patch with a matching id
# overrides that entry's config wholesale, so both capabilities resolve here.
- id: web
  config:
    searchProvider: web-search-free
    fetchProvider: web-search-free

# `web_fetch` is deliberately NOT patched on here.
#
# Every composition ships the model-facing fetch tool off: dsh-base's `tool-web`
# row pins `fetch: false`, dsh-web-app disables that row outright (part of moving
# the whole agent tool plane behind agent presets), and the presets the Web
# surface actually mounts — `dsh/config/agent-presets/*/agent.cordis.yml` —
# pin `fetch: false` again. Preset files are loaded by dsh-agent-presets from
# its own roots and are NOT part of the profile patch stack, so a bundle patch
# cannot reach them anyway.
#
# Turning it on from here would work (registering into the global tool layer
# every agent scope inherits) but would be a STATIC choice: bundle patch layers
# are read once at boot and are not hot-watched — runProfile watches only the
# profile's own cordis.patch.yml and $DSH_HOME/cordis.patch.yml. So the plugin
# mounts tool-web itself instead, as a child fiber keyed on the `enableFetch`
# setting; see `createFetchToolMount` in src/index.ts. That keeps the switch
# live and keeps this file from fighting it — patching `fetch: true` here as
# well would double-register `web_fetch` and throw.
